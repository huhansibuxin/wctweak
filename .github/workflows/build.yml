name: Build wechat_swipe_tweak

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recurse-submodules https://github.com/theos/theos.git ${{ runner.temp }}/theos
          find ${{ runner.temp }}/theos/bin -name "*.pl" -exec sed -i '' '1s|#!/usr/bin/perl|#!/usr/bin/env perl|' {} \;
          echo "THEOS=${{ runner.temp }}/theos" >> $GITHUB_ENV
          echo "THEOS_PACKAGE_SCHEME=rootless" >> $GITHUB_ENV

      - name: Install dependencies
        run: brew install dpkg ldid

      - name: Install SDK
        run: |
          cd ${{ runner.temp }}/theos/sdks
          curl -sLO https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q master.zip
          mv sdks-master/iPhoneOS16.5.sdk .
          rm -rf sdks-master master.zip

      - name: Build
        run: |
          set -o pipefail
          make package 2>&1 | tee build.log

      - name: Fix dependency install name in built dylib (-> @executable_path, 与 WeChatX 一致)
        # 从设备拉回的 CydiaSubstrate 二进制 LINKEDIT 无余量，install_name_tool 无法直接改它。
        # 故改为在 make package 之后，对我们自己刚编译的 dylib（LINKEDIT 正常）改写其 LC_LOAD_DYLIB，
        # 把 CydiaSubstrate 依赖指向 @executable_path/Frameworks/...，再重打包。
        run: |
          set -o pipefail
          DYLIB=.theos/obj/wechat_swipe_tweak.dylib
          FW=$(otool -D Frameworks/CydiaSubstrate.framework/CydiaSubstrate | tail -1)
          echo "framework current install name: $FW"
          echo "before:"; otool -L "$DYLIB" | grep -i cydiasubstrate || true
          install_name_tool -change "$FW" @executable_path/Frameworks/CydiaSubstrate.framework/CydiaSubstrate "$DYLIB"
          ldid -S "$DYLIB"
          echo "after:"; otool -L "$DYLIB" | grep -i cydiasubstrate || true
          # 删除旧的暂存/打包结果，保留已改的 .obj，让 theos 仅重打包（不重编译）
          rm -rf .theos/_ packages/*.deb
          make package 2>&1 | tee -a build.log

      - name: Upload build log (always, for diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload deb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wechat_swipe_tweak-rootless
          path: packages/*.deb
