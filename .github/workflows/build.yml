name: Build wechat_swipe_tweak

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recurse-submodules https://github.com/theos/theos.git ${{ runner.temp }}/theos
          find ${{ runner.temp }}/theos/bin -name "*.pl" -exec sed -i '' '1s|#!/usr/bin/perl|#!/usr/bin/env perl|' {} \;
          echo "THEOS=${{ runner.temp }}/theos" >> $GITHUB_ENV
          echo "THEOS_PACKAGE_SCHEME=rootless" >> $GITHUB_ENV

      - name: Install dependencies
        run: brew install dpkg ldid

      - name: Install SDK
        run: |
          cd ${{ runner.temp }}/theos/sdks
          curl -sLO https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q master.zip
          mv sdks-master/iPhoneOS16.5.sdk .
          rm -rf sdks-master master.zip

      - name: Build
        run: |
          set -o pipefail
          make package 2>&1 | tee build.log

      - name: Fix dependency install name in staged dylib (-> @executable_path, 与 WeChatX 一致)
        # 从设备拉回的 CydiaSubstrate 二进制 LINKEDIT 无余量，install_name_tool 无法直接改它；
        # 且其 id 是 /usr/local/lib/libellekit.dylib（绝对路径），运行时 loader 找不到 TrollFools 放的 ellekit。
        # 故 make package 后，对“打进 deb 的 staged dylib”（.theos/_ 下，fat 双架构）改写其 LC_LOAD_DYLIB
        # 为 @executable_path/Frameworks/CydiaSubstrate.framework/CydiaSubstrate，再用 dpkg-deb 重打包。
        run: |
          set -o pipefail
          {
            DYLIB=$(find .theos/_ -name 'wechat_swipe_tweak.dylib' | head -1)
            if [ -z "$DYLIB" ]; then echo "ERROR: staged dylib not found"; find .theos -name '*.dylib' | head; exit 1; fi
            # 直接从 dylib 自身依赖里取 CydiaSubstrate 当前 install name（可能是 @rpath/... 或绝对路径），
            # 不要取 framework 的 id（二者可能不一致，导致 -change 空操作）。
            CUR=$(otool -L "$DYLIB" | grep -i 'CydiaSubstrate.framework/CydiaSubstrate' | awk '{print $1}' | head -1)
            echo "staged dylib: $DYLIB"
            echo "current CydiaSubstrate dep: $CUR"
            echo "before:"; otool -L "$DYLIB" | grep -i cydiasubstrate || true
            if [ -n "$CUR" ]; then
              install_name_tool -change "$CUR" @executable_path/Frameworks/CydiaSubstrate.framework/CydiaSubstrate "$DYLIB"
            else
              echo "WARN: dylib 中未发现 CydiaSubstrate 依赖！"
            fi
            ldid -S "$DYLIB"
            echo "after:"; otool -L "$DYLIB" | grep -i cydiasubstrate || true
            rm -f packages/*.deb
            dpkg-deb -b .theos/_ "packages/wechat_swipe_tweak.deb"
            echo "=== deb contents ==="; dpkg-deb -c packages/wechat_swipe_tweak.deb
          } 2>&1 | tee -a build.log

      - name: Upload build log (always, for diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload deb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wechat_swipe_tweak-rootless
          path: packages/*.deb
