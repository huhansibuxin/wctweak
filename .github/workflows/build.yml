name: Build WeChat Swipe Tweak

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos (recursive, 含 logos/headers/lib 等 vendor 子模块)
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build package (macOS 用 Xcode 自带 clang + iOS SDK，无需单独工具链)
        env:
          THEOS: ${{ env.THEOS }}
        run: |
          make package FINALPACKAGE=1

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: wechat-swipe-tweak-deb
          path: packages/*.deb
          if-no-files-found: warn
